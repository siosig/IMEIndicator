name: build

# 公開リポジトリのビルド検証と、タグ push 時のリリース生成を行う。
#
# SignPath Foundation の審査では「配布バイナリが公開リポジトリから再現可能な形で
# ビルドされていること」が確認される。そのため、リリース成果物は必ずこの
# ワークフローの成果物だけを使い、手元でビルドした実行ファイルは配布しない。

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-build:
    name: Build and test (.NET, Windows x64)
    runs-on: windows-2022

    # C++ 実装（CMake/vcpkg）は 014-port-to-csharp で削除済み。C# / .NET 10 版がこのリポジトリの
    # 唯一のビルド対象であり、release ジョブが配布する成果物もこのジョブの出力になる。
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: dotnet build IMEIndicator.slnx -c Release

      - name: Test
        shell: pwsh
        run: dotnet test IMEIndicator.slnx -c Release

      - name: Publish (self-contained, single file)
        shell: pwsh
        run: >-
          dotnet publish src/csharp/IMEIndicator/IMEIndicator.csproj -c Release -r win-x64
          -p:SelfContained=true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -o dist/csharp

      - name: Report the produced binary
        shell: pwsh
        run: |
          $exe = 'dist/csharp/IMEIndicator.exe'
          $item = Get-Item $exe
          "Size: {0:N0} bytes" -f $item.Length
          "FileVersion: {0}" -f $item.VersionInfo.FileVersion
          "SHA256: {0}" -f (Get-FileHash $exe -Algorithm SHA256).Hash

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IMEIndicator-csharp
          path: dist/csharp/IMEIndicator.exe
          if-no-files-found: error

  release:
    name: Publish release
    needs: dotnet-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download the build artifact
        uses: actions/download-artifact@v4
        with:
          name: IMEIndicator-csharp
          path: dist

      - name: Create the release
        # サードパーティ Action はタグではなくコミット SHA で固定する。タグは可変で、
        # この job は contents: write を持つため、タグを差し替えられると署名前の成果物を
        # 差し替えられる。更新するときは意図して SHA とコメントの版を書き換えること。
        # https://docs.github.com/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/IMEIndicator.exe
          generate_release_notes: true
          body: |
            Windows x64 build produced by the `build` workflow from this tag.
            Self-contained .NET 10 single-file executable; no runtime install required.

            The executable is **not code signed**. Windows Smart App Control and
            SmartScreen may block it.
